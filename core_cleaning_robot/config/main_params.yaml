          g1:
            x_pose: [-3.88, -3.88]
            y_pose: [1.22, 1.22]
          g2:
            x_pose: [0.84, 0.84]
            y_pose: [0.9, 0.9]
          g3:
            x_pose: [1.22, 1.22]
            y_pose: [-1.0, -1.0]
          g4:
            x_pose: [-1.55, -1.55]
            y_pose: [-2.27, -2.27]
          g5:
            x_pose: [-1.82, -1.82]
            y_pose: [-0.75, -0.75]
          g6:
