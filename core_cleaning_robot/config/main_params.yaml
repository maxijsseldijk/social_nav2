            #- "g1"

          g0:
            x_pose: [2., 2.]  # Start on right side of circle (3+5=8, radius=5)
            y_pose: [-1.0,-1.0]  # Center y=1
          g1:
            x_pose: [-3., -3.]  # Start on right side of circle (3+5=8, radius=5)
            y_pose: [-2.0, -2.0]  # Center y=1

